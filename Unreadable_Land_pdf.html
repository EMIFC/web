<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unreadable Land - Li Xiaotong</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: #2d2d2d;
            font-family: 'Noto Serif SC', Arial, sans-serif;
            overflow: hidden;
            user-select: none;
            -webkit-user-select: none;
        }

        /* 顶部信息栏 */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            background: rgba(0, 0, 0, 0.9);
            padding: 20px 40px;
            z-index: 1000;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
        }

        .header h1 {
            color: #ffffff;
            font-size: 18px;
            font-weight: 400;
            margin-bottom: 5px;
        }

        .header p {
            color: #999;
            font-size: 12px;
        }

        .back-link {
            position: absolute;
            top: 20px;
            right: 40px;
            color: #ffffff;
            text-decoration: none;
            font-size: 14px;
            padding: 8px 16px;
            border: 1px solid rgba(255, 255, 255, 0.3);
            border-radius: 5px;
            transition: all 0.3s;
        }

        .back-link:hover {
            background: rgba(255, 255, 255, 0.1);
        }

        /* PDF容器 */
        #pdf-viewer-container {
            width: 100%;
            height: 100vh;
            padding-top: 80px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background: #2d2d2d;
        }

        #pdf-canvas-container {
            flex: 1;
            width: 100%;
            overflow: auto;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        #pdf-canvas {
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.5);
            max-width: 100%;
            height: auto;
        }

        /* 控制栏 */
        #pdf-controls {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.8);
            padding: 15px 30px;
            border-radius: 30px;
            display: flex;
            align-items: center;
            gap: 20px;
            z-index: 1000;
        }

        .pdf-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .pdf-btn:hover:not(:disabled) {
            background: rgba(255, 255, 255, 0.2);
            transform: translateY(-2px);
        }

        .pdf-btn:disabled {
            opacity: 0.3;
            cursor: not-allowed;
        }

        #page-info {
            color: white;
            font-size: 14px;
            min-width: 100px;
            text-align: center;
        }

        #zoom-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .zoom-btn {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            width: 35px;
            height: 35px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 18px;
            transition: all 0.3s;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .zoom-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: white;
            font-size: 20px;
            z-index: 999;
        }

        .watermark {
            position: fixed;
            bottom: 80px;
            right: 40px;
            color: rgba(255, 255, 255, 0.2);
            font-size: 11px;
            pointer-events: none;
            z-index: 999;
            text-align: right;
        }

        /* 分享按钮 */
        .share-btn {
            position: fixed;
            top: 20px;
            right: 200px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.3);
            color: white;
            padding: 8px 16px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            transition: all 0.3s;
        }

        .share-btn:hover {
            background: rgba(255, 255, 255, 0.2);
        }

        .share-tooltip {
            position: fixed;
            top: 60px;
            right: 200px;
            background: rgba(0, 0, 0, 0.9);
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            font-size: 12px;
            display: none;
            z-index: 1001;
        }

        .share-tooltip.show {
            display: block;
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>Land Tells by Default: on simulation, on war games, and the myth of neutrality</h1>
        <p>Li Xiaotong 李曉烔 | Essay Film | 2025</p>
    </div>

    <button class="share-btn" id="shareBtn">🔗 Share Link</button>
    <div class="share-tooltip" id="shareTooltip">Link copied to clipboard!</div>
    
    <a href="index.html" class="back-link">← Back to Portfolio</a>

    <div class="watermark">
        View Only - For Review Purposes<br>
        © Li Xiaotong 2025
    </div>
    
    <div id="loading">Loading PDF...</div>

    <div id="pdf-viewer-container">
        <div id="pdf-canvas-container">
            <canvas id="pdf-canvas"></canvas>
        </div>

        <div id="pdf-controls">
            <button class="pdf-btn" id="prev-page">◀ Previous</button>
            <span id="page-info">Page 1 of 1</span>
            <button class="pdf-btn" id="next-page">Next ▶</button>
            <div id="zoom-controls">
                <button class="zoom-btn" id="zoom-out">−</button>
                <button class="zoom-btn" id="zoom-in">+</button>
            </div>
        </div>
    </div>

    <!-- PDF.js CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    
    <script>
        // 禁用右键菜单
        document.addEventListener('contextmenu', e => e.preventDefault());
        
        // 禁用常用快捷键
        document.addEventListener('keydown', function(e) {
            if ((e.ctrlKey || e.metaKey) && (e.key === 's' || e.key === 'p' || e.key === 'c')) {
                e.preventDefault();
                return false;
            }
            if (e.key === 'F12' || e.key === 'PrintScreen') {
                e.preventDefault();
                return false;
            }
        });

        // ★ 修改这里的PDF路径为你的PDF文件
        const pdfUrl = 'pdf/unreadableland.pdf';

        // 分享链接功能
        document.getElementById('shareBtn').addEventListener('click', function() {
            const currentUrl = window.location.href;
            
            // 复制到剪贴板
            navigator.clipboard.writeText(currentUrl).then(function() {
                const tooltip = document.getElementById('shareTooltip');
                tooltip.classList.add('show');
                setTimeout(() => {
                    tooltip.classList.remove('show');
                }, 2000);
            }).catch(function(err) {
                alert('Link: ' + currentUrl);
            });
        });

        // PDF.js 配置
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        let pdfDoc = null;
        let pageNum = 1;
        let pageRendering = false;
        let pageNumPending = null;
        let scale = 1.5;
        const canvas = document.getElementById('pdf-canvas');
        const ctx = canvas.getContext('2d');

        // 加载PDF
        pdfjsLib.getDocument(pdfUrl).promise.then(function(pdf) {
            pdfDoc = pdf;
            document.getElementById('loading').style.display = 'none';
            document.getElementById('page-info').textContent = `Page ${pageNum} of ${pdf.numPages}`;
            renderPage(pageNum);
        }).catch(function(error) {
            document.getElementById('loading').textContent = 'Error loading PDF. Please check the file path.';
            console.error('Error loading PDF:', error);
        });

        // 渲染页面
        function renderPage(num) {
            pageRendering = true;
            pdfDoc.getPage(num).then(function(page) {
                const viewport = page.getViewport({ scale: scale });
                canvas.height = viewport.height;
                canvas.width = viewport.width;

                const renderContext = {
                    canvasContext: ctx,
                    viewport: viewport
                };

                const renderTask = page.render(renderContext);
                renderTask.promise.then(function() {
                    pageRendering = false;
                    if (pageNumPending !== null) {
                        renderPage(pageNumPending);
                        pageNumPending = null;
                    }
                });
            });

            document.getElementById('page-info').textContent = `Page ${num} of ${pdfDoc.numPages}`;
            updateButtons();
        }

        function queueRenderPage(num) {
            if (pageRendering) {
                pageNumPending = num;
            } else {
                renderPage(num);
            }
        }

        // 上一页
        document.getElementById('prev-page').addEventListener('click', function() {
            if (pageNum <= 1) return;
            pageNum--;
            queueRenderPage(pageNum);
        });

        // 下一页
        document.getElementById('next-page').addEventListener('click', function() {
            if (pageNum >= pdfDoc.numPages) return;
            pageNum++;
            queueRenderPage(pageNum);
        });

        // 放大
        document.getElementById('zoom-in').addEventListener('click', function() {
            scale += 0.2;
            queueRenderPage(pageNum);
        });

        // 缩小
        document.getElementById('zoom-out').addEventListener('click', function() {
            if (scale <= 0.5) return;
            scale -= 0.2;
            queueRenderPage(pageNum);
        });

        // 更新按钮状态
        function updateButtons() {
            document.getElementById('prev-page').disabled = (pageNum <= 1);
            document.getElementById('next-page').disabled = (pageNum >= pdfDoc.numPages);
        }

        // 键盘快捷键 - 翻页
        document.addEventListener('keydown', function(e) {
            if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') {
                if (pageNum > 1) {
                    pageNum--;
                    queueRenderPage(pageNum);
                }
            } else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') {
                if (pageNum < pdfDoc.numPages) {
                    pageNum++;
                    queueRenderPage(pageNum);
                }
            }
        });
    </script>
</body>
</html>
